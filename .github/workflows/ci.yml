name: NovaCorp CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 716769866080.dkr.ecr.eu-west-2.amazonaws.com
  FRONTEND_IMAGE: novacorp/frontend
  API_IMAGE: novacorp/api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Run API tests
        working-directory: api
        run: pytest tests/ -v || echo "No tests found, skipping"

  sast:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python
        continue-on-error: true

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [test, sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }} ./api
          docker push ${{ env.ECR_REGISTRY }}/${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Run Trivy scan on API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }} ./frontend
          docker push ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Run Trivy scan on frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
        continue-on-error: true

  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout COP repo
        uses: actions/checkout@v4
        with:
          repository: 0byiaks/Cloud-Operations-Platform
          token: ${{ secrets.COP_REPO_TOKEN }}
          ref: main

      - name: Update image tags in manifests
        run: |
          sed -i "s|novacorp/api:.*|novacorp/api:${{ needs.build-and-push.outputs.image_tag }}|g" kubernetes/novacorp/api/deployment.yaml
          sed -i "s|novacorp/frontend:.*|novacorp/frontend:${{ needs.build-and-push.outputs.image_tag }}|g" kubernetes/novacorp/frontend/deployment.yaml

      - name: Commit and push manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/novacorp/api/deployment.yaml kubernetes/novacorp/frontend/deployment.yaml
          git commit -m "chore: update novacorp images to ${{ needs.build-and-push.outputs.image_tag }}"
          git push origin main